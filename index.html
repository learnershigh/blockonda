<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCKONDA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div class="side">
    <div class="panel">
      <h2>TIME</h2>
      <div id="time">-</div>
    </div>
    <div class="panel keys">
      <span class="sec">[설계 5초]</span><br>
      <b>방향키</b>머리 조종<br>
      <b>SPACE</b>모양 확정<br>
      <span class="sec">[낙하 중]</span><br>
      <b>&larr; &rarr;</b>이동<br>
      <b>&darr;</b>소프트드롭<br>
      <b>SPACE</b>하드드롭<br>
      <b>M</b>음소거
    </div>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay"></div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>SCORE</h2>
      <div id="score">0</div>
    </div>
    <div class="panel">
      <h2>NEXT</h2>
      <canvas id="next" class="preview"></canvas>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
