<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#0b0e14; color:#e6edf3;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #wrap { display:flex; gap:18px; padding:20px; }
  .side { width:132px; height:604px; display:flex; flex-direction:column; justify-content:space-between; }
  .panel { background:#141a24; border:1px solid #263042; border-radius:8px; padding:12px; }
  .panel h2 { font-size:12px; letter-spacing:3px; color:#8b949e; margin-bottom:8px; font-weight:600; }
  #score { font-size:26px; color:#58a6ff; font-weight:700; text-align:right; }
  #time { font-size:26px; color:#4cd964; font-weight:700; text-align:right; }
  canvas.preview { display:block; margin:0 auto; }
  #stage { position:relative; }
  #board { display:block; background:#0d1320; border:2px solid #263042; border-radius:4px; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(7,10,18,.85); border-radius:4px; cursor:pointer;
  }
  #overlay.hidden { display:none; }
  #overlay .big { font-size:28px; letter-spacing:6px; font-weight:700; color:#58a6ff; }
  #overlay .small { font-size:13px; color:#9aa4b2; line-height:1.9; }
  .keys { font-size:11px; color:#8b949e; line-height:2; }
  .keys b { color:#c9d1d9; display:inline-block; min-width:50px; font-weight:600; }
  .keys .sec { color:#4cd964; letter-spacing:1px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="side">
    <div class="panel">
      <h2>TIME</h2>
      <div id="time">-</div>
    </div>
    <div class="panel keys">
      <span class="sec">[설계 5초]</span><br>
      <b>방향키</b>머리 조종<br>
      <b>SPACE</b>즉시 드롭<br>
      <span class="sec">[낙하 중]</span><br>
      <b>&larr; &rarr;</b>이동<br>
      <b>&darr;</b>소프트드롭<br>
      <b>SPACE</b>하드드롭
    </div>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay">
      <div class="big">TETRIS</div>
      <div class="small">블록이 나오면 <b>5초</b> 동안 방향키로 머리를 움직여 모양 설계!<br>같은 색 덩어리가 좌우 벽에 모두 닿으면 삭제!<br>클릭 또는 아무 키나 눌러 시작</div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>SCORE</h2>
      <div id="score">0</div>
    </div>
    <div class="panel">
      <h2>NEXT</h2>
      <canvas id="next" class="preview"></canvas>
    </div>
  </div>
</div>

<script>
'use strict';

const COLS = 10, ROWS = 20, CS = 30;   // 필드 10x20, 셀 30px
const PW = 108, PH = 84;               // 프리뷰 캔버스
const DESIGN_MS = 5000;                // 모양 설계 타임
const MIN_LEN = 3, MAX_LEN = 6;        // 블록 길이 범위

// 블록 색 팔레트 — 필드 셀에는 1부터 시작하는 인덱스로 저장(0 = 빈 칸)
const PALETTE = ['#ff5a5f', '#5b8cff', '#f5c542'];

function initCanvas(id, w, h) {
  const cv = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  return ctx;
}
const bctx = initCanvas('board', COLS * CS, ROWS * CS);
const nctx = initCanvas('next', PW, PH);
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');

let field, ids, nextId, cur, nextP, colorBag, score, lines, placed;
let phase, designLeft;                 // phase: 'design' | 'fall'
let over, started, paused, acc;
let shownScore = -1, shownTime = '';

// ---------- 유틸 ----------
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function takeColor() { // 색은 bag 방식으로 고르게 배분
  if (!colorBag.length) colorBag = shuffled(PALETTE.map((_, i) => i + 1));
  return colorBag.pop();
}
function makeNext() {
  return { len: MIN_LEN + Math.floor(Math.random() * (MAX_LEN - MIN_LEN + 1)), color: takeColor() };
}

// ---------- 게임 로직 ----------
// cur = { color, cells: [[r,c], ...] } — cells[0]이 머리, 필드 절대좌표
function spawn() {
  const L = nextP.len, color = nextP.color;
  const col = Math.floor((COLS - 1) / 2);
  const cells = [];
  for (let i = 0; i < L; i++) cells.push([L - 1 - i, col]); // 세로 일자, 머리 = 맨 아래 칸(아래를 봄)
  cur = { color, cells };
  nextP = makeNext();
  drawPreview(nctx, nextP);
  phase = 'design';
  designLeft = DESIGN_MS;
  acc = 0;
  if (cells.some(([r, c]) => field[r][c])) gameOver(); // 등장 위치가 이미 막힘
}
// 설계 타임: 머리를 한 칸 이동, 몸통은 머리 경로를 따라옴
function designMove(dr, dc) {
  const [hr, hc] = cur.cells[0];
  const nr = hr + dr, nc = hc + dc;
  if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return; // 벽: 무시
  if (field[nr][nc]) return;                                // 쌓인 블록: 무시
  const neck = cur.cells[1];                                // 뒤로 가기(바로 뒤 몸통): 아무 일도 없음
  if (neck && nr === neck[0] && nc === neck[1]) return;
  if (cur.cells.some(([r, c]) => r === nr && c === nc)) {   // 그 외 자기 몸 겹침: 페널티 → 즉시 낙하
    startFall();
    return;
  }
  cur.cells.unshift([nr, nc]);
  cur.cells.pop();
}
function startFall() { phase = 'fall'; acc = 0; }
function shapeCanMove(dr, dc) {
  return cur.cells.every(([r, c]) => {
    const nr = r + dr, nc = c + dc;
    return nr < ROWS && nc >= 0 && nc < COLS && !field[nr][nc];
  });
}
function shiftShape(dr, dc) { cur.cells = cur.cells.map(([r, c]) => [r + dr, c + dc]); }
function moveSide(dc) {
  if (phase !== 'fall') return;
  if (shapeCanMove(0, dc)) shiftShape(0, dc);
}
function gravityStep() {
  if (shapeCanMove(1, 0)) shiftShape(1, 0);
  else lockShape();
}
function softDrop() {
  if (shapeCanMove(1, 0)) { shiftShape(1, 0); score++; acc = 0; }
  else lockShape();
}
function hardDrop() {
  while (shapeCanMove(1, 0)) { shiftShape(1, 0); score += 2; }
  lockShape();
}
function lockShape() {
  const id = nextId++; // 이 조각의 모양을 기억 — 삭제 후에도 덩어리째 떨어진다
  cur.cells.forEach(([r, c]) => { field[r][c] = cur.color; ids[r][c] = id; });
  placed++;
  clearConnected();
  if (!over) spawn();
}
// 같은 색 4방향 연결 덩어리 중 왼쪽 벽(0열)과 오른쪽 벽(9열)에 모두 닿은 것들을 찾는다
function findSpanningComponents() {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const comps = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (!field[r][c] || seen[r][c]) continue;
      const color = field[r][c];
      const stack = [[r, c]], cells = [];
      let minC = c, maxC = c;
      seen[r][c] = true;
      while (stack.length) {
        const [cr, cc] = stack.pop();
        cells.push([cr, cc]);
        if (cc < minC) minC = cc;
        if (cc > maxC) maxC = cc;
        for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nr = cr + dr, nc = cc + dc;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (seen[nr][nc] || field[nr][nc] !== color) continue;
          seen[nr][nc] = true;
          stack.push([nr, nc]);
        }
      }
      if (minC === 0 && maxC === COLS - 1) comps.push(cells);
    }
  return comps;
}
// 같은 조각 id로 4방향 연결된 셀 묶음 = 강체 덩어리 (삭제로 두 동강 나면 각각 별개)
function buildChunks() {
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const chunks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (!field[r][c] || seen[r][c]) continue;
      const id = ids[r][c];
      const stack = [[r, c]], cells = [];
      seen[r][c] = true;
      while (stack.length) {
        const [cr, cc] = stack.pop();
        cells.push([cr, cc]);
        for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nr = cr + dr, nc = cc + dc;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (seen[nr][nc] || !field[nr][nc] || ids[nr][nc] !== id) continue;
          seen[nr][nc] = true;
          stack.push([nr, nc]);
        }
      }
      chunks.push({ cells, set: new Set(cells.map(([cr, cc]) => cr + ',' + cc)) });
    }
  return chunks;
}
function chunkCanFall(ch) {
  return ch.cells.every(([r, c]) => r + 1 < ROWS && (!field[r + 1][c] || ch.set.has((r + 1) + ',' + c)));
}
function dropChunk(ch) {
  const vals = ch.cells.map(([r, c]) => [field[r][c], ids[r][c]]);
  ch.cells.forEach(([r, c]) => { field[r][c] = 0; ids[r][c] = 0; });
  ch.cells = ch.cells.map(([r, c]) => [r + 1, c]);
  ch.cells.forEach(([r, c], i) => { field[r][c] = vals[i][0]; ids[r][c] = vals[i][1]; });
  ch.set = new Set(ch.cells.map(([r, c]) => r + ',' + c));
}
function applyGravity() { // 삭제로 뜬 덩어리는 모양 그대로, 지지될 때까지 한 칸씩 낙하
  const chunks = buildChunks();
  let moved = true;
  while (moved) {
    moved = false;
    for (const ch of chunks)
      if (chunkCanFall(ch)) { dropChunk(ch); moved = true; }
  }
}
function clearConnected() {
  let chain = 0;
  while (true) {
    const comps = findSpanningComponents();
    if (!comps.length) break;
    chain++; // 낙하로 새 연결이 생기면 연쇄 — 배율 x2, x3...
    let cells = 0;
    comps.forEach(comp => comp.forEach(([r, c]) => { field[r][c] = 0; ids[r][c] = 0; cells++; }));
    lines += comps.length;
    score += cells * 10 * chain;
    applyGravity();
  }
}
function dropDist() {
  let d = 0;
  while (cur.cells.every(([r, c]) => r + d + 1 < ROWS && !field[r + d + 1][c])) d++;
  return d;
}
function dropInterval() { // 놓은 블록 수 기준으로 가속
  return Math.max(90, 750 - Math.floor(placed / 25) * 60);
}

function gameOver() {
  over = true;
  showOverlay('GAME OVER', 'SCORE ' + score + '<br>Enter 키로 다시 시작');
}
function resetGame() {
  field = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  ids = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  nextId = 1;
  score = 0; lines = 0; placed = 0;
  over = false; paused = false;
  acc = 0; colorBag = [];
  nextP = makeNext();
  spawn();
}
function start() { started = true; paused = false; overlay.classList.add('hidden'); }
function showOverlay(big, small) {
  overlay.innerHTML = '<div class="big">' + big + '</div><div class="small">' + small + '</div>';
  overlay.classList.remove('hidden');
}

// ---------- 렌더링 ----------
function drawCell(ctx, px, py, size, color, ghost) {
  const p = 1, s = size - 2;
  if (ghost) {
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = color;
    ctx.fillRect(px + p, py + p, s, s);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.strokeRect(px + p + .5, py + p + .5, s - 1, s - 1);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.fillStyle = color;
  ctx.fillRect(px + p, py + p, s, s);
  const b = Math.max(2, Math.floor(size * 0.14));
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(px + p, py + p, s, b);
  ctx.fillRect(px + p, py + p, b, s);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(px + p, py + p + s - b, s, b);
  ctx.fillRect(px + p + s - b, py + p, b, s);
}
function headDot(ctx, px, py, size) { // 설계 중 조종하는 머리 표시
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(px + size / 2, py + size / 2, Math.max(2, size * 0.16), 0, Math.PI * 2);
  ctx.fill();
}
function drawPreview(ctx, p) {
  ctx.clearRect(0, 0, PW, PH);
  if (!p) return;
  const s = 13; // 최대 6칸 세로가 들어가는 크기
  const ox = (PW - s) / 2, oy = (PH - p.len * s) / 2;
  for (let i = 0; i < p.len; i++) drawCell(ctx, ox, oy + i * s, s, PALETTE[p.color - 1]);
  headDot(ctx, ox, oy + (p.len - 1) * s, s); // 머리 = 맨 아래
}
function draw() {
  const W = COLS * CS, H = ROWS * CS;
  bctx.fillStyle = '#0d1320';
  bctx.fillRect(0, 0, W, H);
  bctx.strokeStyle = 'rgba(255,255,255,0.045)';
  bctx.lineWidth = 1;
  bctx.beginPath();
  for (let c = 1; c < COLS; c++) { bctx.moveTo(c * CS + .5, 0); bctx.lineTo(c * CS + .5, H); }
  for (let r = 1; r < ROWS; r++) { bctx.moveTo(0, r * CS + .5); bctx.lineTo(W, r * CS + .5); }
  bctx.stroke();

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (field[r][c]) drawCell(bctx, c * CS, r * CS, CS, PALETTE[field[r][c] - 1]);

  if (cur && !over) {
    const color = PALETTE[cur.color - 1];
    const d = dropDist();
    if (d > 0) cur.cells.forEach(([r, c]) => drawCell(bctx, c * CS, (r + d) * CS, CS, color, true));
    cur.cells.forEach(([r, c]) => drawCell(bctx, c * CS, r * CS, CS, color));
    if (phase === 'design') {
      const [hr, hc] = cur.cells[0];
      headDot(bctx, hc * CS, hr * CS, CS);
    }
  }

  if (shownScore !== score) { shownScore = score; scoreEl.textContent = score; }
  const t = (cur && !over && phase === 'design') ? (Math.max(0, designLeft) / 1000).toFixed(1) : '-';
  if (shownTime !== t) {
    shownTime = t;
    timeEl.textContent = t;
    timeEl.style.color = (t !== '-' && +t <= 1.5) ? '#ff5a5f' : '#4cd964';
  }
}

// ---------- 입력 ----------
const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', 'Space', 'Enter'];
document.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (over) { if (e.code === 'Enter') { resetGame(); start(); } return; }
  if (!started) { start(); return; }
  if (paused) { paused = false; overlay.classList.add('hidden'); return; }
  if (e.repeat && e.code === 'Space') return;
  if (phase === 'design') {
    switch (e.code) {
      case 'ArrowLeft': designMove(0, -1); break;
      case 'ArrowRight': designMove(0, 1); break;
      case 'ArrowUp': designMove(-1, 0); break;
      case 'ArrowDown': designMove(1, 0); break;
      case 'Space': startFall(); hardDrop(); break; // 조기 확정 + 즉시 드롭
    }
  } else {
    switch (e.code) {
      case 'ArrowLeft': moveSide(-1); break;
      case 'ArrowRight': moveSide(1); break;
      case 'ArrowDown': softDrop(); break;
      case 'Space': hardDrop(); break;
    }
  }
});
overlay.addEventListener('click', () => {
  if (over) { resetGame(); start(); return; }
  if (!started) { start(); return; }
  if (paused) { paused = false; overlay.classList.add('hidden'); }
});
window.addEventListener('blur', () => { // iframe 포커스를 잃으면 자동 일시정지
  if (started && !over) { paused = true; showOverlay('PAUSED', '클릭해서 계속'); }
});

// ---------- 루프 ----------
let rafLast = performance.now();
function frame(t) {
  const dt = Math.min(t - rafLast, 250);
  rafLast = t;
  if (started && !over && !paused) {
    if (phase === 'design') {
      designLeft -= dt;
      if (designLeft <= 0) startFall();
    } else {
      acc += dt;
      let iv = dropInterval();
      while (acc >= iv && !over && phase === 'fall') { acc -= iv; gravityStep(); iv = dropInterval(); }
    }
  }
  draw();
  requestAnimationFrame(frame);
}
resetGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
